<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdClear</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <div class="brand">
      <div class="mark">A</div>
      <div>
        <h1>AdClear</h1>
        <p>Simple ad filtering</p>
      </div>
    </div>
    <div class="status">
      <span class="dot"></span>
      <div>
        <strong>Protection enabled</strong>
        <p>Filtering supported ad requests</p>
      </div>
    </div>
    <p class="note">Some services deliver ads through the same systems as playback. Results can vary by website and may change over time.</p>
    <footer>AdClear <span>v1.0.0</span></footer>
  </main>
</body>
</html>
